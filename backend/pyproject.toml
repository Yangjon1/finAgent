[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "finagent-backend"
version = "0.1.0"
description = "FinAgent FastAPI foundation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "pymysql>=1.1,<2.0",
  "redis>=5.0,<6.0",
  "boto3>=1.35,<2.0",
  "qdrant-client>=1.12,<2.0",
  "alembic>=1.14,<2.0",
  "PyJWT>=2.9,<3.0",
  "pwdlib[argon2]>=0.2,<1.0",
  "pypdf>=5.0,<6.0",
  "langgraph>=0.2,<1.0",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1.0", "pytest>=8.3,<9.0", "ruff>=0.8,<1.0"]
ocr = ["paddleocr>=2.9,<3.0"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
